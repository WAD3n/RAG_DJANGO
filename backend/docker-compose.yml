services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      PG_DSN: postgresql://ragdocs:ragdocs@postgres:5432/ragdocs
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [ragdla]
    restart: unless-stopped

  consumer:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: python manage.py run_consumer
    env_file:
      - ../.env
    environment:
      PG_DSN: postgresql://ragdocs:ragdocs@postgres:5432/ragdocs
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [ragdla]
    restart: unless-stopped

volumes:
  model_cache:

networks:
  ragdla:
    external: true
    name: ragdla

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>RAG — Przepływ Procesu</title>
<style>
* { margin: 0; padding: 0; }
body { background: #08111e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" width="1280" height="720"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif">
<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#0d1b30"/>
    <stop offset="100%" stop-color="#07101d"/>
  </linearGradient>

  <radialGradient id="cGlow" cx="640" cy="310" r="360" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#1e3a6e" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#0d1b30" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="centerG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#ecf1fa"/>
    <stop offset="100%" stop-color="#c6d1e8"/>
  </linearGradient>

  <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#f5f8fd"/>
    <stop offset="100%" stop-color="#dce4f4"/>
  </linearGradient>

  <!-- Arrow markers — markerUnits=userSpaceOnUse = fixed px size -->
  <marker id="a1" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0,0 16,6 0,12" fill="#e8900a"/>
  </marker>
  <marker id="a2" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0,0 16,6 0,12" fill="#c8960a"/>
  </marker>
  <marker id="a3" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0,0 16,6 0,12" fill="#2460d0"/>
  </marker>
  <marker id="a4" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0,0 16,6 0,12" fill="#d02850"/>
  </marker>
  <marker id="a5" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0,0 16,6 0,12" fill="#10a090"/>
  </marker>
  <marker id="a6" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0,0 16,6 0,12" fill="#e87020"/>
  </marker>

  <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
    <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
  </filter>

</defs>

<!-- Background -->
<rect width="1280" height="720" fill="url(#bg)"/>
<rect width="1280" height="720" fill="url(#cGlow)"/>

<!-- Title -->
<text x="640" y="52" text-anchor="middle"
      fill="white" font-size="34" font-weight="700" letter-spacing="0.3">
  RAG dla dokumentów — Przepływ Procesu
</text>

<!-- ═══════════════════════════════════
     ARROWS
═══════════════════════════════════ -->

<!-- 1. Center → Step1 | orange arc (top-left) -->
<path d="M 543,256 C 425,150 292,182 222,263"
      fill="none" stroke="#e8900a" stroke-width="5" stroke-linecap="round" marker-end="url(#a1)"/>

<!-- 2. Step1 → Step2 | gold arc (down) -->
<path d="M 187,315 C 215,385 268,418 295,450"
      fill="none" stroke="#c8960a" stroke-width="5" stroke-linecap="round" marker-end="url(#a2)"/>

<!-- 3. Step2 → Step3 | blue arc (right along bottom) -->
<path d="M 387,456 C 456,460 524,498 594,516"
      fill="none" stroke="#2460d0" stroke-width="5" stroke-linecap="round" marker-end="url(#a3)"/>

<!-- 4. Step3 → Step4 | red arc (right along bottom) -->
<path d="M 687,516 C 758,498 822,468 894,456"
      fill="none" stroke="#d02850" stroke-width="5" stroke-linecap="round" marker-end="url(#a4)"/>

<!-- 5. Step4 → Step5 | teal arc (up-right) -->
<path d="M 966,415 C 1008,375 1060,348 1074,316"
      fill="none" stroke="#10a090" stroke-width="5" stroke-linecap="round" marker-end="url(#a5)"/>

<!-- 6. Step5 → Center | orange arc (top-right return) -->
<path d="M 1059,262 C 958,158 812,170 738,256"
      fill="none" stroke="#e87020" stroke-width="5" stroke-linecap="round" marker-end="url(#a6)"/>

<!-- ═══════════════════════════════════
     CENTER BOX
═══════════════════════════════════ -->
<!-- outer glow ring -->
<rect x="537" y="164" width="207" height="207" rx="28"
      fill="none" stroke="#2a4a88" stroke-width="2" opacity="0.7"/>
<!-- shadow offset -->
<rect x="547" y="177" width="195" height="195" rx="24" fill="#12285a" opacity="0.55"/>
<!-- main box -->
<rect x="543" y="172" width="195" height="195" rx="24"
      fill="url(#centerG)" filter="url(#shadow)"/>
<!-- inner border shimmer -->
<rect x="543" y="172" width="195" height="195" rx="24"
      fill="none" stroke="#b0c0da" stroke-width="1.5" opacity="0.55"/>
<!-- center text -->
<text x="640" y="236" text-anchor="middle"
      fill="#1a2d50" font-size="24" font-weight="800" letter-spacing="1.5">RAG</text>
<text x="640" y="268" text-anchor="middle"
      fill="#1a2d50" font-size="24" font-weight="800" letter-spacing="1.5">DLA</text>
<text x="640" y="300" text-anchor="middle"
      fill="#1a2d50" font-size="24" font-weight="800" letter-spacing="1.5">DOKUMENTÓW</text>
<!-- connector dots (decorative) -->
<circle cx="543" cy="270" r="5" fill="#2a4a88" opacity="0.6"/>
<circle cx="738" cy="270" r="5" fill="#2a4a88" opacity="0.6"/>
<circle cx="640" cy="367" r="5" fill="#2a4a88" opacity="0.4"/>

<!-- ═══════════════════════════════════
     STEP 1 — WGRAJ PDF
     box center: (175, 268)
═══════════════════════════════════ -->
<rect x="133" y="228" width="92" height="92" rx="16" fill="#c87010" opacity="0.4"/>
<rect x="129" y="222" width="92" height="92" rx="16" fill="url(#iconG)" filter="url(#shadow)"/>
<g transform="translate(175,268)">
  <!-- document -->
  <rect x="-15" y="-22" width="30" height="38" rx="4" fill="#fef3e2" stroke="#e8900a" stroke-width="2.5"/>
  <line x1="-8" y1="-10" x2="8"  y2="-10" stroke="#e8900a" stroke-width="2" opacity="0.7"/>
  <line x1="-8" y1="-2"  x2="8"  y2="-2"  stroke="#e8900a" stroke-width="2" opacity="0.5"/>
  <line x1="-8" y1="6"   x2="3"  y2="6"   stroke="#e8900a" stroke-width="2" opacity="0.4"/>
  <!-- upload badge -->
  <circle cx="12" cy="12" r="13" fill="#e8900a"/>
  <line x1="12" y1="18" x2="12" y2="6"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="7,12 12,6 17,12" fill="none" stroke="white" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="175" y="336" text-anchor="middle"
      fill="#f59e0b" font-size="12.5" font-weight="800" letter-spacing="1.5">WGRAJ PDF</text>
<text x="175" y="353" text-anchor="middle" fill="#94a3b8" font-size="10.5">Użytkownik przesyła</text>
<text x="175" y="368" text-anchor="middle" fill="#94a3b8" font-size="10.5">dokument PDF przez</text>
<text x="175" y="383" text-anchor="middle" fill="#94a3b8" font-size="10.5">interfejs webowy</text>

<!-- ═══════════════════════════════════
     STEP 2 — OCR & KONWERSJA
     box center: (340, 458)
═══════════════════════════════════ -->
<rect x="298" y="418" width="92" height="92" rx="16" fill="#a07808" opacity="0.4"/>
<rect x="294" y="412" width="92" height="92" rx="16" fill="url(#iconG)" filter="url(#shadow)"/>
<g transform="translate(340,458)">
  <!-- scan lines -->
  <line x1="-27" y1="-18" x2="27" y2="-18" stroke="#c8960a" stroke-width="2" opacity="0.35"/>
  <line x1="-27" y1="18"  x2="27" y2="18"  stroke="#c8960a" stroke-width="2" opacity="0.35"/>
  <!-- eye -->
  <path d="M -25,0 C -12,-19 12,-19 25,0 C 12,19 -12,19 -25,0 Z"
        fill="none" stroke="#c8960a" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="9" fill="#c8960a" opacity="0.18"/>
  <circle cx="0" cy="0" r="9" fill="none" stroke="#c8960a" stroke-width="2"/>
  <circle cx="0" cy="0" r="4" fill="#c8960a"/>
  <circle cx="3" cy="-3" r="2" fill="white" opacity="0.5"/>
</g>
<text x="340" y="526" text-anchor="middle"
      fill="#fbbf24" font-size="12.5" font-weight="800" letter-spacing="1.5">OCR &amp; KONWERSJA</text>
<text x="340" y="543" text-anchor="middle" fill="#94a3b8" font-size="10.5">docling + EasyOCR</text>
<text x="340" y="558" text-anchor="middle" fill="#94a3b8" font-size="10.5">przetwarza strony PDF</text>
<text x="340" y="573" text-anchor="middle" fill="#94a3b8" font-size="10.5">i wyodrębnia tekst</text>

<!-- ═══════════════════════════════════
     STEP 3 — CHUNKING & EMBEDDING
     box center: (640, 528)
═══════════════════════════════════ -->
<rect x="598" y="488" width="92" height="92" rx="16" fill="#1038a8" opacity="0.4"/>
<rect x="594" y="482" width="92" height="92" rx="16" fill="url(#iconG)" filter="url(#shadow)"/>
<g transform="translate(640,528)">
  <!-- 2×2 chunk grid -->
  <rect x="-22" y="-22" width="18" height="18" rx="3" fill="#2460d0"/>
  <rect x="-1"  y="-22" width="18" height="18" rx="3" fill="#2460d0" opacity="0.65"/>
  <rect x="-22" y="-1"  width="18" height="18" rx="3" fill="#2460d0" opacity="0.65"/>
  <rect x="-1"  y="-1"  width="18" height="18" rx="3" fill="#2460d0" opacity="0.35"/>
  <!-- vector dots -->
  <circle cx="26" cy="-16" r="4" fill="#2460d0"/>
  <circle cx="26" cy="0"   r="4" fill="#2460d0" opacity="0.7"/>
  <circle cx="26" cy="16"  r="4" fill="#2460d0" opacity="0.4"/>
  <line x1="17" y1="-13" x2="22" y2="-16" stroke="#2460d0" stroke-width="1.5" opacity="0.55"/>
  <line x1="17" y1="8"   x2="22" y2="0"   stroke="#2460d0" stroke-width="1.5" opacity="0.55"/>
  <line x1="17" y1="17"  x2="22" y2="16"  stroke="#2460d0" stroke-width="1.5" opacity="0.35"/>
</g>
<text x="640" y="595" text-anchor="middle"
      fill="#60a5fa" font-size="12.5" font-weight="800" letter-spacing="1.5">CHUNKING &amp; EMBEDDING</text>
<text x="640" y="612" text-anchor="middle" fill="#94a3b8" font-size="10.5">Podział tekstu na fragmenty</text>
<text x="640" y="627" text-anchor="middle" fill="#94a3b8" font-size="10.5">+ wektory 1024-dim</text>
<text x="640" y="642" text-anchor="middle" fill="#94a3b8" font-size="10.5">(mmlw-retrieval-roberta-large)</text>

<!-- ═══════════════════════════════════
     STEP 4 — WYSZUKIWANIE
     box center: (940, 458)
═══════════════════════════════════ -->
<rect x="898" y="418" width="92" height="92" rx="16" fill="#a01028" opacity="0.4"/>
<rect x="894" y="412" width="92" height="92" rx="16" fill="url(#iconG)" filter="url(#shadow)"/>
<g transform="translate(940,458)">
  <circle cx="0" cy="0" r="28" fill="none" stroke="#d02850" stroke-width="1.8" opacity="0.22"/>
  <circle cx="0" cy="0" r="20" fill="none" stroke="#d02850" stroke-width="2"   opacity="0.44"/>
  <circle cx="0" cy="0" r="12" fill="none" stroke="#d02850" stroke-width="2.2" opacity="0.72"/>
  <circle cx="0" cy="0" r="5"  fill="#d02850"/>
  <!-- magnifier handle -->
  <line x1="20" y1="20" x2="28" y2="28" stroke="#d02850" stroke-width="3.5" stroke-linecap="round"/>
</g>
<text x="940" y="526" text-anchor="middle"
      fill="#f87171" font-size="12.5" font-weight="800" letter-spacing="1.5">WYSZUKIWANIE</text>
<text x="940" y="543" text-anchor="middle" fill="#94a3b8" font-size="10.5">pgvector cosine similarity</text>
<text x="940" y="558" text-anchor="middle" fill="#94a3b8" font-size="10.5">zwraca top-k pasujących</text>
<text x="940" y="573" text-anchor="middle" fill="#94a3b8" font-size="10.5">fragmentów dokumentu</text>

<!-- ═══════════════════════════════════
     STEP 5 — GENEROWANIE
     box center: (1105, 268)
═══════════════════════════════════ -->
<rect x="1063" y="228" width="92" height="92" rx="16" fill="#087860" opacity="0.4"/>
<rect x="1059" y="222" width="92" height="92" rx="16" fill="url(#iconG)" filter="url(#shadow)"/>
<g transform="translate(1105,268)">
  <!-- chat bubble -->
  <rect x="-26" y="-24" width="52" height="36" rx="11" fill="#10a090"/>
  <polygon points="-14,12 -24,26 -5,12" fill="#10a090"/>
  <!-- lightning bolt -->
  <path d="M 6,-16 L -5,2 L 4,2 L -7,18"
        fill="none" stroke="white" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="1105" y="336" text-anchor="middle"
      fill="#2dd4bf" font-size="12.5" font-weight="800" letter-spacing="1.5">GENEROWANIE</text>
<text x="1105" y="353" text-anchor="middle" fill="#94a3b8" font-size="10.5">Qwen2.5-1.5B generuje</text>
<text x="1105" y="368" text-anchor="middle" fill="#94a3b8" font-size="10.5">odpowiedź na podstawie</text>
<text x="1105" y="383" text-anchor="middle" fill="#94a3b8" font-size="10.5">kontekstu z dokumentu</text>

</svg>
</body>
</html>

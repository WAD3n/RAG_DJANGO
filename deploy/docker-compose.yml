services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragdocs
      POSTGRES_USER: ragdocs
      POSTGRES_PASSWORD: ragdocs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdocs -d ragdocs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ragdla]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ragdla]

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks: [ragdla]

  # ── Backend ───────────────────────────────────────────────────────────────

  api:
    image: ragdla/backend:latest
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PG_DSN: postgresql://ragdocs:ragdocs@postgres:5432/ragdocs
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
    volumes:
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    restart: unless-stopped
    networks: [ragdla]

  consumer:
    image: ragdla/backend:latest
    command: python manage.py run_consumer
    env_file: .env
    environment:
      PG_DSN: postgresql://ragdocs:ragdocs@postgres:5432/ragdocs
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    restart: unless-stopped
    networks: [ragdla]

  # ── Frontend ──────────────────────────────────────────────────────────────

  frontend:
    image: ragdla/frontend:latest
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks: [ragdla]

volumes:
  pgdata:
  minio_data:
  kafka_data:
  model_cache:

networks:
  ragdla:
    name: ragdla

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metrics_path: /metrics

  - job_name: loki
    static_configs:
      - targets: [loki:3100]
    metrics_path: /metrics

  - job_name: django
    static_configs:
      - targets: [api:8000]
    metrics_path: /metrics
    honor_labels: true

  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
    metrics_path: /metrics
